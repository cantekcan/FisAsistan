services:
  postgres:
    image: postgres:16-alpine
    container_name: fisasistan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fisasistan
      POSTGRES_USER: fisasistan
      POSTGRES_PASSWORD: fisasistan_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fisasistan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisasistan -d fisasistan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FisAsistan.Api/Dockerfile
    container_name: fisasistan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=fisasistan;Username=fisasistan;Password=fisasistan_dev_password"
      Jwt__Secret: "DEV_ONLY_CHANGE_THIS_SECRET_KEY_AT_LEAST_32_CHARS_LONG!"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5175"
      Cors__AllowedOrigins__2: "http://127.0.0.1:5175"
    ports:
      - "8080:8080"
    volumes:
      - fisasistan_storage:/app/storage

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: fisasistan-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5175:80"

volumes:
  fisasistan_pgdata:
  fisasistan_storage:
